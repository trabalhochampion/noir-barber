:center}.pricing .sectionintro{margin:0 auto}.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left;margin-top:58px}.pricecard{position:relative;border:1px solid #484033;background:#151617;padding:34px;border-radius:8px}.pricecard.featured{border-color:#d1aa70;background:#1e1b17}.popular{position:absolute;right:20px;top:-13px;background:#d5b176;color:#19140d;font-size:10px;font-weight:800;padding:8px 12px;letter-spacing:1px}.price{font-size:48px;font-weight:700;margin:30px 0}.price small{font-size:18px;vertical-align:top;margin-right:5px}.price span{font-size:13px;color:#aaa39a;font-weight:400}.pricecard p{min-height:80px}.pricecard button{width:100%;margin-top:20px}.fine{color:#817b72;font-size:11px;margin-top:25px}.lastcta{text-align:center;background:radial-gradient(ellipse at center,#382b1a,#0c0c0c 70%);padding:110px 20px}.lastcta .goldbtn{margin-top:20px}.site footer{border-top:1px solid #383024;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:35px max(34px,calc((100vw - 1250px)/2));color:#8d867c;font-size:12px}.site footer b{font:700 26px Georgia;color:#e9e2d7}@media(max-width:900px){.sitehero{grid-template-columns:1fr;gap:60px;padding-top:60px}.showcase{max-width:620px;transform:none}.features{grid-template-columns:repeat(2,1fr)}.sitehead nav{gap:15px}.steps{grid-template-columns:1fr}.pricegrid{grid-template-columns:1fr}}@media(max-width:600px){.sitehead{padding:0 20px;height:75px}.sitehead nav{display:none}.sitehero{padding:60px 22px 90px}.site h1{font-size:50px}.site h2{font-size:40px}.actions{flex-direction:column;align-items:flex-start}.showcase{margin:0 7px}.screeninner{padding:15px}.dashgrid strong{font-size:19px}.floating{left:-10px}.section{padding:75px 22px}.features{grid-template-columns:1fr}.site footer{padding:30px 22px;flex-wrap:wrap}.strip{gap:18px}.pricecard{padding:27px}}</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),date=d=>d?d.split('-').reverse().join('/'):'',roles={owner:'Gestor',barber:'Barbeiro',client:'Cliente'};let state=null,page='home',authMode='login',signupRole='client',slot='',chosen='',busy=false;const app=$('#app');async function api(url,method='GET',body){let r=await fetch('/api'+url,{method,headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro de conexão');return d}function msg(t){alert(t)}async function refresh(){try{state=await api('/me')}catch{state=null}render()}async function act(fn){try{await fn();await refresh()}catch(e){msg(e.message)}}function field(n,label,type='text',value='',extra=''){return `<label>${label}</label><input name="${n}" type="${type}" value="${esc(value)}" ${extra} required>`}function options(arr,value=''){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}function navitems(){let r=state.user.role;return r==='client'?[['home','Início'],['catalog','Serviços'],['booking','Agendar'],['agenda','Meus horários'],['profile','Perfil']]:r==='barber'?[['home','Visão geral'],['agenda','Minha agenda'],['finance','Financeiro'],['profile','Perfil']]:[['home','Visão geral'],['agenda','Agenda geral'],['finance','Financeiro'],['team','Equipe'],['services','Serviços'],['settings','Configurações'],['billing','Minha assinatura'],['profile','Perfil']]}function landing(){app.innerHTML=`<div class="site"><header class="sitehead"><a class="wordmark" href="#" onclick="event.preventDefault();location.hash='';render()">NOIR<span>.</span></a><nav><a href="#vantagens">Recursos</a><a href="#precos">Planos</a><a href="#como">Como funciona</a></nav><button class="outline" onclick="location.hash='acesso';authMode='login';location.hash='acesso';render()">Entrar ↗</button></header><section class="sitehero"><div class="glow"></div><div class="heroleft"><div class="micro">✦ BARBER MANAGEMENT, REDEFINED</div><h1>O futuro da sua<br><em>barbearia</em> começa<br>aqui.</h1><p>Agenda, equipe, clientes e finanças em um só lugar. A gestão que seu negócio merece, por um preço que cabe no bolso.</p><div class="actions"><button class="goldbtn" onclick="location.hash='cadastro';authMode='signup';signupRole='owner';render()">Começar 14 dias grátis <span>↗</span></button><a class="textlink" href="#precos">Conhecer os planos ↓</a></div><div class="proof"><span>✓ Sem cartão de crédito</span><span>✓ Sem taxa de instalação</span><span>✓ Feito para celular</span></div></div><div class="showcase"><div class="screen"><div class="screenbar"><b>NOIR<span style="color:#d5b176">.</span></b><span>PAINEL DE CONTROLE</span><i>● ● ●</i></div><div class="screeninner"><small>VISÃO GERAL / SEU NEGÓCIO</small><h3>Bom dia, gestor.</h3><div class="dashgrid"><div><small>RECEITA DO MÊS</small><strong>R$ 12.480</strong><span>↗ +18,5% este mês</span></div><div><small>ATENDIMENTOS</small><strong>186</strong><span>↗ +12% este mês</span></div></div><div class="bars">${[40,65,50,78,60,88,75,100,72,92,82,96].map((n,i)=>`<div style="height:${n}%;opacity:${i===7?1:.55}"></div>`).join('')}</div><div class="drow"><span>Hoje • 09:00</span><b>Corte + Barba</b><em>Confirmado</em></div><div class="drow"><span>Hoje • 10:30</span><b>Degradê</b><em>Confirmado</em></div></div></div><div class="floating">✦ <b>Seu negócio, no controle.</b><small>Dados ilustrativos</small></div></div></section><div class="strip"><span>AGENDAMENTOS</span><span>✦</span><span>GESTÃO FINANCEIRA</span><span>✦</span><span>EQUIPE</span><span>✦</span><span>CLIENTES</span><span>✦</span><span>RESULTADOS</span></div><section class="section" id="vantagens"><div class="micro">TUDO O QUE VOCÊ PRECISA</div><h2>Menos planilhas.<br><em>Mais barbearia.</em></h2><p class="sectionintro">Do primeiro agendamento ao fechamento do caixa: simplifique sua rotina sem perder o controle.</p><div class="features"><article><span>01 /</span><div class="featureicon">◷</div><h3>Agenda inteligente</h3><p>Horários disponíveis, escolha do profissional e reservas sem conflito.</p></article><article><span>02 /</span><div class="featureicon">▥</div><h3>Financeiro claro</h3><p>Receitas, formas de pagamento, custos e relatórios por atendimento.</p></article><article><span>03 /</span><div class="featureicon">♟</div><h3>Equipe sob controle</h3><p>Cadastre profissionais, acompanhe comissões e desempenho.</p></article><article><span>04 /</span><div class="featureicon">✂</div><h3>Experiência do cliente</h3><p>Serviços, valores e agendamento em um ambiente elegante.</p></article></div></section><section class="section steps" id="como"><div><div class="micro">COMECE EM MINUTOS</div><h2>Simples de usar.<br><em>Fácil de crescer.</em></h2></div><div class="stepitems"><p><b>01</b> Crie sua conta e cadastre sua barbearia.</p><p><b>02</b> Configure serviços, preços e profissionais.</p><p><b>03</b> Compartilhe seu link e receba agendamentos.</p></div></section><section class="section pricing" id="precos"><div class="micro">PREÇOS JUSTOS, SEM COMPLICAÇÃO</div><h2>Premium no sistema.<br><em>Leve no preço.</em></h2><p class="sectionintro">Experimente gratuitamente por 14 dias. Cobrança online em preparação; nenhum pagamento será realizado nesta versão.</p><div class="pricegrid">${[['SOLO','14,90','1 profissional','Agenda e clientes, catálogo de serviços e controle básico.'],['PRO','24,90','Até 5 profissionais','Tudo do Solo, mais comissões e relatórios financeiros.'],['BLACK','39,90','Equipe ampliada*','Gestão avançada, estoque e pacotes planejados.']].map((x,i)=>`<article class="pricecard ${i===1?'featured':''}">${i===1?'<div class="popular">MAIS ESCOLHIDO</div>':''}<div class="micro">NOIR ${x[0]}</div><div class="price"><small>R$</small>${x[1]}<span>/mês</span></div><h3>${x[2]}</h3><p>${x[3]}</p><button class="${i===1?'goldbtn':'outline'}" onclick="location.hash='cadastro';authMode='signup';signupRole='owner';render()">Testar grátis ↗</button></article>`).join('')}</div><p class="fine">*Plano Black sujeito a política de uso justo. Valores propostos para lançamento. Recursos avançados serão liberados gradualmente.</p></section><section class="lastcta"><div class="micro">O PRÓXIMO NÍVEL É AGORA</div><h2>Sua barbearia merece<br><em>mais.</em></h2><button class="goldbtn" onclick="location.hash='cadastro';authMode='signup';signupRole='owner';render()">Criar minha conta grátis ↗</button></section><footer><b>NOIR.</b><span>BARBER OS © 2026</span><span>Gestão com personalidade.</span></footer></div>`}

function auth(){if(!location.hash.includes('acesso')&&!location.hash.includes('cadastro'))return landing();let signup=authMode==='signup';app.innerHTML=`<div class="auth"><div class="brand">NOIR</div><p style="text-align:center">BARBER CLUB · BUSINESS EDITION</p><div class="card"><span class="eyebrow">${signup?'Novo acesso':'Bem-vindo de volta'}</span><h2>${signup?'Crie sua conta':'Entre no seu espaço'}</h2><div class="tabs"><button class="tab ${!signup?'on':''}" onclick="authMode='login';location.hash='acesso';render()">Entrar</button><button class="tab ${signup?'on':''}" onclick="authMode='signup';location.hash='cadastro';render()">Cadastrar</button></div>${signup?`<div class="tabs"><button class="tab ${signupRole==='client'?'on':''}" onclick="signupRole='client';render()">Sou cliente</button><button class="tab ${signupRole==='owner'?'on':''}" onclick="signupRole='owner';render()">Sou dono de barbearia</button></div>`:''}<form id="authForm">${signup?field('name','Nome completo'):''}${signup?field('phone','Telefone','tel'):''}${signup?field('slug',signupRole==='owner'?'Identificador da barbearia (ex.: noir-centro)':'Identificador da barbearia (recebido do estabelecimento)') :''}${signup&&signupRole==='owner'?field('shopName','Nome da barbearia'):''}${field('email','E-mail','email')}${field('password','Senha (mínimo 8 caracteres)','password')}<button class="btn" style="width:100%;margin-top:20px">${signup?'Criar conta':'Entrar'}</button></form><p>Barbeiros recebem acesso criado pelo gestor. Cada barbearia possui sua própria equipe e seus próprios dados.</p></div><div class="foot">NOIR BARBER OS · 5.0</div></div>`;$('#authForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(signup)d.role=signupRole;act(async()=>{await api(signup?'/register':'/login','POST',d);page='home'})}}
function render(){if(!state)return auth();let n=navitems();if(!n.some(x=>x[0]===page))page='home';app.innerHTML=`<div class="layout"><aside class="side"><div class="brand">NOIR.</div><p>${esc(state.shop.name)}</p><span class="pill">${roles[state.user.role]}</span><div class="navs">${n.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="page='${x[0]}';render()">${x[1]}</button>`).join('')}</div><button class="btn alt" style="margin-top:30px" onclick="act(async()=>{await api('/logout','POST');state=null})">Sair</button></aside><main><div class="row spread"><span class="eyebrow">NOIR / ${roles[state.user.role]}</span><span>Olá, ${esc(state.user.name)}</span></div><div id="content">${state.user.role==='owner'&&!state.canOperate?'<div class="notice">Seu período de teste ou assinatura terminou. A contratação online ainda não está habilitada.</div>':''}${views[page]()}</div><div class="foot">NOIR BARBER CLUB · Gestão com personalidade</div></main></div>`;bind()}
const bookings=()=>state.bookings,done=()=>bookings().filter(x=>x.status==='done'),sum=(a,f)=>a.reduce((v,x)=>v+Number(f(x)||0),0),metrics=()=>{let d=done(),revenue=sum(d,x=>x.paid),cost=sum(d,x=>x.cost),commission=sum(d,x=>x.paid*x.commission/100);return{revenue,cost,commission,profit:revenue-cost-(state.user.role==='owner'?commission:0),clients:new Set(d.map(x=>x.client_id)).size}};
function stat(label,value,sub=''){return `<div class="card"><small>${label}</small><div class="metric">${value}</div><small>${sub}</small></div>`}function home(){let m=metrics(),r=state.user.role;if(r==='client')return `<div class="hero"><span class="eyebrow">Seu estilo começa aqui</span><h1>O próximo corte<br>é uma experiência.</h1><p>Escolha seu serviço, encontre seu barbeiro e reserve seu horário.</p><button class="btn" onclick="page='booking';render()">Agendar agora →</button></div><h2>Seus próximos horários</h2>${table(bookings().filter(x=>x.status==='booked'))}`;return `<div class="hero"><span class="eyebrow">Dashboard ${roles[r]}</span><h1>Visão de negócio.</h1><p>Atendimentos, receitas, pagamentos e desempenho em um só lugar.</p></div><div class="grid">${stat('Receita recebida',brl(m.revenue))}${stat('Custos dos serviços',brl(m.cost))}${stat(r==='owner'?'Comissões estimadas':'Minha comissão estimada',brl(m.commission))}${stat(r==='owner'?'Resultado estimado':'Receita menos custo estimado',brl(m.profit))}${stat('Clientes atendidos',m.clients)}${stat('Agendamentos ativos',bookings().filter(x=>x.status==='booked').length)}</div><h2>Últimos atendimentos</h2>${table(bookings().slice(0,8))}`}
function table(rows){return `<div class="card tablewrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Barbeiro</th><th>Serviço</th><th>Valor</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${date(x.day)} · ${x.time}</td><td>${esc(x.client)}</td><td>${esc(x.barber)}</td><td>${esc(x.service)}</td><td>${brl(x.paid||x.price)}</td><td>${esc(x.payment)}</td><td><span class="pill">${esc(x.status)}</span></td><td><div class="row">${x.status==='booked'&&state.user.role!=='client'?`<button class="btn" onclick="finish('${x.id}',${x.price})">Finalizar</button>`:''}${x.status==='booked'?`<button class="btn danger" onclick="cancel('${x.id}')">Cancelar</button>`:''}${x.client_phone&&state.user.role!=='client'?`<button class="btn alt" onclick="whats('${esc(x.client_phone)}','${esc(x.client)}','${date(x.day)}','${x.time}')">WhatsApp</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8">Nenhum registro encontrado.</td></tr>'}</tbody></table></div>`}
function agenda(){return `<h1>${state.user.role==='client'?'Meus agendamentos':'Agenda de atendimentos'}</h1><p>Os registros são filtrados conforme seu nível de acesso.</p>${table(bookings())}`}
function catalog(){let groups=Object.groupBy(state.services.filter(x=>x.active),x=>x.category);return `<h1>Experiências NOIR</h1><p>Todos os serviços de uma barbearia completa, do corte clássico à transformação.</p>${Object.entries(groups).map(([k,v])=>`<h2>${esc(k)}</h2><div class="grid">${v.map(s=>`<div class="card"><span class="eyebrow">${esc(s.category)}</span><h3>${esc(s.name)}</h3><p>${s.duration} minutos</p><div class="row spread"><strong style="color:var(--gold)">${brl(s.price)}</strong><button class="btn" onclick="chosen='${s.id}';page='booking';render()">Agendar</button></div></div>`).join('')}</div>`).join('')}`}
function booking(){let ss=state.services.filter(x=>x.active),bb=state.barbers.filter(x=>x.active);return `<h1>Reserve seu horário</h1><p>Escolha o serviço, o profissional e a melhor data para você.</p><div class="card" style="max-width:700px"><form id="bookingForm"><label>Serviço</label><select name="service" id="service" required>${options(ss,chosen)}</select><label>Barbeiro</label><select name="barber" id="barber" required>${options(bb)}</select>${field('day','Data','date',new Date().toLocaleDateString('sv-SE'))}<label>Horários disponíveis</label><div id="slots" class="slots"></div><input type="hidden" name="time" id="time"><button class="btn" style="margin-top:22px" ${bb.length?'':'disabled'}>Confirmar agendamento</button></form>${bb.length?'':'<div class="notice">Esta barbearia ainda não cadastrou profissionais.</div>'}</div>`}
function finance(){let m=metrics();return `<h1>Relatório financeiro</h1><p>Visão dos serviços realizados, formas de pagamento, receita, custos e comissões.</p><div class="grid">${stat('Recebido',brl(m.revenue))}${stat('Custos',brl(m.cost))}${stat('Comissões',brl(m.commission))}${stat('Resultado estimado',brl(m.profit))}</div><button class="btn" onclick="csv()">Exportar planilha CSV ↓</button><h2>Histórico financeiro</h2>${table(done())}`}
function team(){return `<h1>Equipe profissional</h1><p>Crie credenciais individuais e configure as comissões.</p><div class="grid">${state.barbers.map(b=>`<div class="card"><h3>${esc(b.name)}</h3><p>${b.active?'Ativo':'Inativo'}</p><label>Comissão (%)</label><input type="number" min="0" max="100" value="${b.commission}" id="com-${b.id}"><div class="row" style="margin-top:12px"><button class="btn" onclick="updateBarber('${b.id}',${b.active})">Salvar</button><button class="btn alt" onclick="updateBarber('${b.id}',${b.active?0:1})">${b.active?'Desativar':'Ativar'}</button></div></div>`).join('')}</div><div class="card" style="max-width:650px"><h2>Adicionar barbeiro</h2><form id="teamForm">${field('name','Nome')}${field('email','E-mail','email')}${field('phone','Telefone','tel')}${field('password','Senha inicial','password')}${field('commission','Comissão (%)','number','50','min="0" max="100"')}<button class="btn" style="margin-top:16px">Criar acesso</button></form></div>`}
function services(){return `<h1>Catálogo & preços</h1><div class="grid">${state.services.map(s=>`<div class="card"><form onsubmit="editService(event,'${s.id}')">${field('name','Serviço','text',s.name)}${field('category','Categoria','text',s.category)}${field('price','Preço (R$)','number',s.price,'min="0" step="0.01"')}${field('duration','Duração (min)','number',s.duration,'min="5"')}${field('cost','Custo (R$)','number',s.cost,'min="0" step="0.01"')}<label>Disponibilidade</label><select name="active"><option value="1" ${s.active?'selected':''}>Ativo</option><option value="0" ${!s.active?'selected':''}>Inativo</option></select><button class="btn" style="margin-top:15px">Salvar alterações</button></form></div>`).join('')}</div><div class="card"><h2>Novo serviço</h2><form id="serviceForm">${field('name','Nome')}${field('category','Categoria')}${field('price','Preço','number','55','min="0" step="0.01"')}${field('duration','Duração em minutos','number','45','min="5"')}${field('cost','Custo estimado','number','5','min="0" step="0.01"')}<button class="btn" style="margin-top:15px">Adicionar</button></form></div>`}
function settings(){let s=state.shop;return `<h1>Configurações da barbearia</h1><div class="card" style="max-width:650px"><form id="settingsForm">${field('name','Nome da barbearia','text',s.name)}${field('phone','WhatsApp da barbearia','tel',s.phone)}${field('open','Abre às','time',s.open)}${field('close','Fecha às','time',s.close)}<button class="btn" style="margin-top:18px">Salvar</button></form><div class="notice">Seu endereço de divulgação: <strong>${esc(location.origin+'/?shop='+s.slug)}</strong></div></div>`}
function profile(){let u=state.user;return `<h1>Meu perfil</h1><div class="card" style="max-width:600px"><span class="pill">${roles[u.role]}</span><form id="profileForm">${field('name','Nome','text',u.name)}${field('phone','Telefone','tel',u.phone)}<label>E-mail</label><input value="${esc(u.email)}" disabled><button class="btn" style="margin-top:18px">Atualizar perfil</button></form></div>`}
function billing(){let sub=state.subscription||{},plans=state.plans||{},days=Math.max(0,Math.ceil((sub.trial_end-Date.now())/86400000));return `<div class="hero"><span class="eyebrow">NOIR / ASSINATURAS</span><h1>Um plano para cada fase.</h1><p>14 dias de teste gratuito. Sem cartão. Cancele quando quiser após ativar uma assinatura com o provedor de cobrança.</p><span class="pill">Situação: ${esc(sub.status||'indefinido')} · ${sub.status==='trialing'?days+' dias restantes':esc(sub.plan||'')}</span></div><div class="grid">${Object.entries(plans).map(([id,p])=>`<div class="card"><span class="eyebrow">${esc(p.name)}</span><h2>${brl(p.monthly/100)}<small>/mês</small></h2><p>${p.barbers===null?'Profissionais ilimitados*':'Até '+p.barbers+' profissional(is)'}</p><p>Anual: ${brl(p.yearly/100)}</p><p>${id==='solo'?'Agenda, catálogo e clientes':id==='pro'?'Gestão de equipe, comissões e financeiro':'Gestão completa e expansão da equipe'}</p><button class="btn ${sub.plan===id?'alt':''}" onclick="requestCheckout('${id}','monthly')">${sub.plan===id?'Plano selecionado':'Escolher mensal'}</button> <button class="btn alt" onclick="requestCheckout('${id}','yearly')">Anual</button></div>`).join('')}</div><div class="notice">Os preços são reais da proposta comercial, mas o checkout ainda não está conectado a um processador de pagamentos. Nenhuma cobrança será feita nesta versão. *Sujeito a uso justo.</div>`}
async function requestCheckout(plan,interval){try{let d=await api('/checkout','POST',{plan,interval});msg(d.message)}catch(e){msg(e.message)}}
const views={billing,home,agenda,catalog,booking,finance,team,services,settings,profile};function bind(){let form=$('#bookingForm');if(form){let load=async()=>{let d=Object.fromEntries(new FormData(form));chosen=d.service;$('#slots').innerHTML='<small>Carregando horários...</small>';try{let v=await api(`/slots?day=${encodeURIComponent(d.day)}&barber=${encodeURIComponent(d.barber)}&service=${encodeURIComponent(d.service)}`);$('#slots').innerHTML=v.slots.map(t=>`<button type="button" class="slot" onclick="slot='${t}';document.querySelector('#time').value=slot;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('on',x.textContent===slot))">${t}</button>`).join('')||'<small>Sem horários disponíveis.</small>'}catch(e){$('#slots').textContent=e.message}};['service','barber','day'].forEach(k=>form.elements[k].addEventListener('change',load));if(state.barbers.some(x=>x.active))load();form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));if(!d.time)return msg('Escolha um horário.');act(async()=>{await api('/bookings','POST',d);page='agenda';msg('Agendamento confirmado!')})}}for(let [id,endpoint,method] of [['teamForm','/barbers','POST'],['serviceForm','/services','POST'],['settingsForm','/settings','PATCH'],['profileForm','/profile','PATCH']]){let f=$('#'+id);if(f)f.onsubmit=e=>{e.preventDefault();act(()=>api(endpoint,method,Object.fromEntries(new FormData(f))))}}}
function cancel(id){if(confirm('Cancelar este agendamento?'))act(()=>api('/bookings/'+id,'PATCH',{status:'cancelled'}))}function finish(id,price){let payment=prompt('Forma de pagamento: pix, credit, debit, cash ou pending','pix');if(payment===null)return;let paid=prompt('Valor recebido (R$)',price);if(paid===null)return;act(()=>api('/bookings/'+id,'PATCH',{status:'done',payment,paid:Number(paid)}))}function updateBarber(id,active){act(()=>api('/barbers/'+id,'PATCH',{commission:Number($('#com-'+id).value),active}))}function editService(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.active=d.active==='1';act(()=>api('/services/'+id,'PATCH',d))}function csv(){let headers=['Data','Hora','Cliente','Barbeiro','Serviço','Preço','Recebido','Custo','Comissão','Pagamento','Status'],rows=done().map(x=>[x.day,x.time,x.client,x.barber,x.service,x.price,x.paid,x.cost,(x.paid*x.commission/100).toFixed(2),x.payment,x.status]);let csv=[headers,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='noir-financeiro.csv';a.click();URL.revokeObjectURL(a.href)}function whats(phone,name,day,time){let digits=phone.replace(/\D/g,'');if(digits.length===11)digits='55'+digits;let text=`Olá, ${name}! Seu horário na ${state.shop.name} está marcado para ${day} às ${time}. Até breve!`;window.open('https://wa.me/'+digits+'?text='+encodeURIComponent(text),'_blank','noopener')}refresh();
</script></body></html>
